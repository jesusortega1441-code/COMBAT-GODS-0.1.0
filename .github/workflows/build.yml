name: Compilar Combat Gods Mod
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8

      - name: Descomprimir proyecto y organizar estructura de Forge
        run: |
          echo "Buscando archivos zip del proyecto..."
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Descomprimiendo $ZIP_FILE..."
            unzip -q "$ZIP_FILE" -d extracted_project/
            
            # Crear la estructura estándar que Forge exige
            mkdir -p src/main/java
            mkdir -p src/main/resources
            
            # Mover carpetas de código y recursos al sitio correcto de manera inteligente
            if [ -d "extracted_project/java" ]; then
              cp -r extracted_project/java/* src/main/java/
            elif [ -d "extracted_project/src/main/java" ]; then
              cp -r extracted_project/src/main/java/* src/main/java/
            fi

            if [ -d "extracted_project/resources" ]; then
              cp -r extracted_project/resources/* src/main/resources/
            elif [ -d "extracted_project/src/main/resources" ]; then
              cp -r extracted_project/src/main/resources/* src/main/resources/
            elif [ -d "extracted_project/assets" ]; then
              mkdir -p src/main/resources
              cp -r extracted_project/assets src/main/resources/
            fi

            # Asegurar que el META-INF/mods.toml exista
            mkdir -p src/main/resources/META-INF
            FOUND_TOML=$(find extracted_project -name "mods.toml" | head -1)
            if [ -n "$FOUND_TOML" ]; then
              cp "$FOUND_TOML" src/main/resources/META-INF/mods.toml
            else
              echo -e "modLoader=\"javafml\"\nloaderVersion=\"[47,)\"\n[[mods]]\nmodId=\"combatgods\"\nversion=\"0.1.0\"\ndisplayName=\"Combat Gods\"" > src/main/resources/META-INF/mods.toml
            fi
          else
            echo "ERROR CRÍTICO: No se encontró ningún archivo .zip con el código en la raíz."
            exit 1
          fi

      - name: Compilar mod con Gradle
        run: gradle build --no-daemon --stacktrace

      - name: Verificar clases y mods.toml dentro del JAR
        run: |
          ls -la build/libs
          JAR_FILE=$(find build/libs -name "*.jar" | head -1)
          echo "Verificando contenido de $JAR_FILE..."
          unzip -l "$JAR_FILE" | grep -q "META-INF/mods.toml" || { echo "ERROR: Falta el mods.toml"; exit 1; }
          unzip -l "$JAR_FILE" | grep -q ".class" || { echo "ERROR: El jar no contiene archivos de código .class"; exit 1; }
          echo "¡Validación exitosa! El jar contiene código y configuración."

      - name: Guardar el .jar como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: combatgods-mod-jar
          path: build/libs/*.jar
          
