name: Compilar Combat Gods Mod
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8

      - name: Descomprimir proyecto y ubicar carpeta del mod
        run: |
          echo "Buscando archivos zip..."
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Descomprimiendo $ZIP_FILE..."
            unzip -q "$ZIP_FILE"
          else
            echo "No se encontró zip, buscando carpeta..."
          fi
          
          # Verificar si la carpeta combatgods existe
          if [ -d "combatgods" ]; then
            echo "Carpeta combatgods encontrada."
          else
            echo "ERROR: No se encuentra la carpeta combatgods."
            exit 1
          fi

      - name: Compilar mod con Gradle desde la carpeta del proyecto
        run: |
          cd combatgods
          gradle build --no-daemon --stacktrace

      - name: Verificar clases y mods.toml dentro del JAR
        run: |
          ls -la combatgods/build/libs
          JAR_FILE=$(find combatgods/build/libs -name "*.jar" | head -1)
          echo "Verificando contenido de $JAR_FILE..."
          unzip -l "$JAR_FILE" | grep -q "META-INF/mods.toml" || { echo "ERROR: Falta el mods.toml"; exit 1; }
          unzip -l "$JAR_FILE" | grep -q ".class" || { echo "ERROR: El jar no contiene archivos de código .class"; exit 1; }
          echo "¡Validación exitosa! El jar contiene código y configuración."

      - name: Guardar el .jar como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: combatgods-mod-jar
          path: combatgods/build/libs/*.jar
